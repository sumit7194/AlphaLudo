[package]
name = "alphaludo_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "alphaludo_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ludo_core = { path = "../ludo_core" }
ludo_search = { path = "../ludo_search" }
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rand = "0.8"
rayon = "1.10"
